name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Implementations are added phase by phase (see PLAN.md); their jobs only run once the project exists.
  detect:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.detect.outputs.python }}
      typescript: ${{ steps.detect.outputs.typescript }}
      golang: ${{ steps.detect.outputs.golang }}
      rust: ${{ steps.detect.outputs.rust }}
      elixir: ${{ steps.detect.outputs.elixir }}
      cpp: ${{ steps.detect.outputs.cpp }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          echo "python=$([ -f rpg-python/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "typescript=$([ -f rpg-typescript/tsconfig.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "golang=$([ -f rpg-golang/go.mod ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "rust=$([ -f rpg-rust/Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "elixir=$([ -f rpg-elixir/mix.exs ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "cpp=$([ -f rpg-cpp/CMakeLists.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Biome (root JSON/TS)
        run: bun run lint:ci
      - name: Shared data (schemas, i18n keys, art)
        run: bun run check:shared
      - name: Commit messages (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rpg-python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Format (ruff)
        run: uv run ruff format --check
      - name: Lint (ruff)
        run: uv run ruff check
      - name: Types (mypy strict)
        run: uv run mypy
      - name: Tests (unit, integration, golden, e2e) + coverage
        run: uv run pytest

  typescript:
    needs: detect
    if: needs.detect.outputs.typescript == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rpg-typescript
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Lint and format (Biome)
        run: bun run lint:ci
      - name: Types (tsc 7)
        run: bun run typecheck
      - name: Tests (unit, integration, golden, e2e) + coverage
        run: bun run test:coverage
      - name: Build single-file executable
        run: bun run build
      - name: Smoke test the executable
        shell: bash
        run: ./dist/rpg-typescript --version && ./dist/rpg-typescript --simulate 1 --vocation mage --difficulty easy

  golang:
    needs: detect
    if: needs.detect.outputs.golang == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rpg-golang
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: rpg-golang/go.mod
          cache-dependency-path: rpg-golang/go.sum
      - name: Embed shared content (go generate)
        run: go generate ./...
      - name: Format (gofmt)
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Lint (golangci-lint)
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          working-directory: rpg-golang
      - name: Tests (unit, integration, golden, e2e) with race detector and coverage
        if: runner.os == 'Linux'
        run: go test -race -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1
      - name: Tests (unit, integration, golden, e2e)
        if: runner.os != 'Linux'
        run: go test -count=1 ./...
      - name: Build executable
        run: go build -o bin/rpg-golang ./cmd/rpg
      - name: Smoke test the executable
        run: ./bin/rpg-golang --version && ./bin/rpg-golang --simulate 1 --vocation mage --difficulty easy

  rust:
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rpg-rust
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: rpg-rust
      - name: Format (rustfmt)
        run: cargo fmt --check
      - name: Lint (clippy)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2.87.23
        with:
          tool: cargo-llvm-cov
      - name: Tests (unit, integration, golden, e2e) + coverage floors (80% overall, 90% domain + application)
        if: runner.os == 'Linux'
        run: |
          cargo llvm-cov --locked --summary-only --fail-under-lines 80
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex '(presentation|infrastructure|main\.rs|assets\.rs|version\.rs)' --fail-under-lines 90
      - name: Tests (unit, integration, golden, e2e)
        if: runner.os != 'Linux'
        run: cargo test --locked
      - name: Build executable
        run: cargo build --release --locked
      - name: Smoke test the executable
        run: ./target/release/rpg-rust --version && ./target/release/rpg-rust --simulate 1 --vocation mage --difficulty easy

  elixir:
    needs: detect
    if: needs.detect.outputs.elixir == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rpg-elixir
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: "29"
          elixir-version: "1.20.4"
      - name: Format (mix format)
        run: mix format --check-formatted
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
      - name: Tests (unit, integration, golden, e2e) + coverage
        run: mix test --cover --warnings-as-errors
      - name: Build escript
        run: MIX_ENV=prod mix escript.build
      # On Windows an escript has no shebang support, so it runs through the escript launcher.
      - name: Smoke test the escript
        run: escript bin/rpg-elixir --version && escript bin/rpg-elixir --simulate 1 --vocation mage --difficulty easy
