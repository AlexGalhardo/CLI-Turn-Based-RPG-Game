[project]
name = "rpg"
version = "1.3.6"
description = "Endless turn-based RPG for the terminal — Python reference implementation"
readme = "../README.md"
license = "MIT"
authors = [{ name = "Alex Galhardo" }]
requires-python = ">=3.14"
dependencies = ["textual==8.2.8"]

[project.scripts]
rpg = "rpg.__main__:main"
rpg-golden = "rpg.tools.golden:main"

[dependency-groups]
dev = [
	"mypy==2.3.1",
	"pytest==9.1.1",
	"pytest-asyncio==1.4.0",
	"pytest-cov==7.1.0",
	"ruff==0.16.9",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF", "PL", "PT"]
# E101/W191: tabs are the project standard (.editorconfig). PLR2004: small literals in tests/UI are fine.
ignore = ["W191", "E101", "PLR2004", "PLR0913", "PLR0911", "PLR0912"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["textual.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rpg --cov-report=term-missing --cov-fail-under=80 -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["rpg"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
